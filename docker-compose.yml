# docker-compose.yml (Compose V2)
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.3.arm64
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL","/usr/bin/zookeeper-shell localhost:2181 ls / >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - zk-data:/var/lib/zookeeper/data
      - zk-txn-logs:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.9.3.arm64
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      # ZK-mode (good for single-broker local dev)
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_BROKER_ID: 1

      # Single internal listener (other containers use "kafka:9092")
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Topic defaults & broker housekeeping
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"

    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL","/usr/bin/kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot topic initializer (deterministic topic creation)
  kafka-init:
    image: confluentinc/cp-kafka:7.9.3.arm64
    container_name: kafka-init
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    env_file: [.env]
    entrypoint: ["/bin/bash","-lc"]
    command: >
      set -euo pipefail;
      echo "Waiting for Kafka at kafka:9092...";
      for i in {1..60}; do
        if /usr/bin/kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1; then
          echo "Kafka is responding (attempt $${i})."; break;
        fi;
        echo "Still waiting (attempt $${i})"; sleep 2;
      done;
      echo "Creating topic '${KAFKA_TOPIC:-covid_events}' if it doesn't exist...";
      /usr/bin/kafka-topics --bootstrap-server kafka:9092 \
        --create --if-not-exists \
        --topic "${KAFKA_TOPIC:-covid_events}" \
        --partitions "${KAFKA_NUM_PARTITIONS:-3}" \
        --replication-factor "${KAFKA_DEFAULT_REPLICATION_FACTOR:-1}";
      echo "Current topics:";
      /usr/bin/kafka-topics --bootstrap-server kafka:9092 --list

  spark-master:
    image: apache/spark:3.5.1-python3
    container_name: spark-master
    restart: unless-stopped
    command: ["/opt/spark/bin/spark-class","org.apache.spark.deploy.master.Master","--host","spark-master"]
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./data/output:/opt/spark-output

  spark-worker:
    image: apache/spark:3.5.1-python3
    container_name: spark-worker
    restart: unless-stopped
    depends_on: [spark-master]
    command: ["/opt/spark/bin/spark-class","org.apache.spark.deploy.worker.Worker","spark://spark-master:7077"]
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    ports:
      - "8081:8081"
    volumes:
      - ./data/output:/opt/spark-output

  spark-streaming:
    image: apache/spark:3.5.1-python3
    container_name: spark-streaming
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    env_file: [.env]
    volumes:
      - ./spark:/opt/spark-app
      - ./data/output:/opt/spark-output
      - ./cache/ivy:/tmp/.ivy2
    entrypoint:
      - /bin/bash
      - -lc
      - >
        mkdir -p /tmp/.ivy2 /opt/spark-output &&
        chmod -R 777 /opt/spark-output &&
        exec /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
        --conf spark.jars.ivy=/tmp/.ivy2
        --conf spark.sql.shuffle.partitions=1
        /opt/spark-app/app.py

  producer:
    build:
      context: ./producer
    container_name: producer
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    env_file: [.env]
    environment:
      PYTHONUNBUFFERED: "1"
    command: ["python","-u","producer.py"]

volumes:
  kafka-data:
    name: covid-pipeline-kafka-data
  zk-data:
  zk-txn-logs:
